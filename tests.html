<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pruebas · Block of the Dead</title>
  <style>
    :root { --ok: #2e9d3a; --bad: #d93a3a; --ink: #2b1a0e; }
    body { margin: 0; padding: 24px; font: 15px/1.5 system-ui, sans-serif; background: #f6ecd6; color: var(--ink); }
    h1 { margin: 0 0 4px; font-size: 22px; }
    #summary { margin: 0 0 16px; font-weight: 700; }
    #summary.ok { color: var(--ok); }
    #summary.bad { color: var(--bad); }
    ul { list-style: none; margin: 0; padding: 0; max-width: 820px; }
    li { display: flex; gap: 10px; padding: 8px 12px; margin-bottom: 6px; background: #fff; border-radius: 8px; border-left: 6px solid var(--ok); }
    li.bad { border-left-color: var(--bad); }
    li .msg { color: var(--bad); font-size: 13px; }
    li small { margin-left: auto; color: #8a7a60; }
  </style>
</head>
<body>
  <h1>Pruebas automáticas · Block of the Dead</h1>
  <p id="summary">Ejecutando…</p>
  <ul id="results"></ul>

  <!-- Solo la lógica del juego (sin interfaz ni dibujo) -->
  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/pieces.js"></script>
  <script src="js/board.js"></script>
  <script src="js/defenses.js"></script>
  <script src="js/zombies.js"></script>
  <script src="js/projectiles.js"></script>
  <script src="js/levels.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/game.js"></script>
  <script src="js/tutorial.js"></script>
  <script src="js/input.js"></script>
  <script src="js/tests.js"></script>
</body>
</html>
