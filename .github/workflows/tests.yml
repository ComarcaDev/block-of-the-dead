name: Pruebas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    name: Pruebas automáticas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Playwright y Chromium
        run: |
          npm init -y > /dev/null
          npm install --no-save --no-audit --no-fund playwright@1.48.2
          npx playwright install --with-deps chromium

      - name: Ejecutar las pruebas (tests.html)
        run: node ci/run-tests.mjs
